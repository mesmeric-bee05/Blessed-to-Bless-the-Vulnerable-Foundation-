name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile enforced)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.bbvf.org
          NEXT_PUBLIC_SITE_STATUS: live

      # Audit the dependencies that actually ship. The advisories currently open
      # in this tree are inside the local Wrangler/Miniflare build toolchain
      # (devDependencies), which is never bundled into the site.
      - name: Dependency audit (runtime, high and above)
        run: npm audit --omit=dev --audit-level=high
