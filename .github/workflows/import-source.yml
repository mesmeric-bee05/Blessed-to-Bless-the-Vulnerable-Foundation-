name: import-source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, verify and commit source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=eb05d57f7578bf93d421bcb74eb04a22c795ddd298021ae426624d58e7201b2f
          curl -fsSL -A "Mozilla/5.0" --max-time 180 "https://n.uguu.se/iCjVdgfbjPEq.tar.gz" -o /tmp/src.tar.gz
          echo "$EXPECTED  /tmp/src.tar.gz" | sha256sum -c -
          tar -xzf /tmp/src.tar.gz -C .
          rm -f /tmp/src.tar.gz
          git config user.name "mesmeric-bee05"
          git config user.email "mesmeric-bee05@users.noreply.github.com"
          git add -A
          git commit -m "feat: serve programmes, campaigns and stories from the CMS; fix staff profile lookup"
          git push
