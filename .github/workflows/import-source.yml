name: import-source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, verify and commit source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=0c84d74bd281a4e95a45e04f64b9caec2e6660129d0c3d8107e0702c5aac6d71
          curl -fsSL -A "Mozilla/5.0" --max-time 180 "https://d.uguu.se/tTGGVMzJomkZ.tar.gz" -o /tmp/src.tar.gz
          echo "$EXPECTED  /tmp/src.tar.gz" | sha256sum -c -
          tar -xzf /tmp/src.tar.gz -C .
          rm -f /tmp/src.tar.gz
          git config user.name "mesmeric-bee05"
          git config user.email "mesmeric-bee05@users.noreply.github.com"
          git add -A
          git commit -m "feat: import BBVF website, database schema and security documentation"
          git push
